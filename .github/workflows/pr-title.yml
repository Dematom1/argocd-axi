name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! [[ "$PR_TITLE" =~ ^(feat|fix|chore|ci|docs|refactor|test|perf|build|revert)(\([^)]+\))?!?:\ .+ ]]; then
            echo "PR title must use an allowed conventional commit format: $PR_TITLE" >&2
            exit 1
          fi
