name: release-please

on:
  push:
    branches: [main]
  # Recovery path: re-publish an existing release tag whose publish failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.1.1)
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag and GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build and verify in a job with no npm publishing permission: `npm ci` runs
  # dependency install scripts, which must never see the npm OIDC token.
  build:
    needs: release-please
    if: >-
      ${{ !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release tag
    outputs:
      spec: ${{ steps.pack.outputs.spec }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Validate recovery tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          # npm provenance records the run's GITHUB_REF and GITHUB_SHA, so the
          # recovery run must be dispatched on the tag itself.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "Dispatch this workflow on the tag: gh workflow run release-please.yml --ref $TAG -f tag=$TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Verify the tag matches the run and package version
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG is not the commit this run's provenance will record ($GITHUB_SHA)" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "${TAG#v}" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Publishing the packed tarball skips prepublishOnly, so run its gate here.
      - run: npm run check

      - name: Pack
        id: pack
        run: |
          set -eu
          tarball="$(npm pack --ignore-scripts --silent)"
          spec="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # Publishing runs in its own job with no checkout, no install and no package
  # scripts, so the npm OIDC token is only ever seen by the npm CLI itself.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing needs npm >= 11.5.1 and `npm stage` needs
      # npm >= 11.15.0.
      - name: Require npm >= 11.15.0
        run: |
          set -eu
          version="$(npm --version)"
          if ! node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && minor >= 15) ? 0 : 1);
          ' "$version"; then
            echo "::error::npm $version is too old; npm stage publish needs npm >= 11.15.0."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Publish unless this version is already on npm
        env:
          SPEC: ${{ needs.build.outputs.spec }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -eu
          if [ -n "$(npm view "$SPEC" version 2>/dev/null)" ]; then
            echo "$SPEC is already published; nothing to do."
            exit 0
          fi
          if ! npm stage publish "./$TARBALL" --access public --provenance --ignore-scripts; then
            echo "::error::Staging $SPEC failed. If an earlier run already staged it, approve it with 'npm stage approve <id>' or discard it on npmjs.com instead of re-running."
            exit 1
          fi
          version="${SPEC##*@}"
          stage_list="$(npm stage list "${SPEC%@*}" --json 2>/dev/null || true)"
          stage_id="$(node -e 'try { const stages = JSON.parse(process.argv[1]); const stage = stages.find(entry => entry.version === process.argv[2]); process.stdout.write(String(stage?.id ?? stage?.stageId ?? "unavailable")); } catch { process.stdout.write("unavailable"); }' "$stage_list" "$version")"
          {
            echo "## Pending npm stage approval"
            echo "- Stage ID: $stage_id"
            echo "- Package: ${SPEC%@*}"
            echo "- Version: $version"
            echo "- Waiting for approval: run axi-approve"
          } >> "$GITHUB_STEP_SUMMARY"
